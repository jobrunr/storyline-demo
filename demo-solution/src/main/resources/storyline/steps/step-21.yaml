title: "Replacing Outdated Jobs"
estimatedTime: PT4M

scenario: |
  A customer updated their address AFTER submitting a credit card application,
  but BEFORE the job processed. The pending job has the old address.
  <br><br>
  We need to update the job with the new information.

challenge: |
  How do we update or replace a job that's already enqueued or even processing?

solution: |
  Use <strong>enqueueOrReplace()</strong> to update existing jobs:
  <br><br>
  <pre class="p-0 m-0">
  <code class="language-java hljs">
  // Create job with a unique ID
  UUID jobId = JobProId.fromIdentifier(customer.getEmail());
  jobScheduler.enqueue(jobId, () -> processApplication(customer));

  // Later, customer updates their info...
  customer.setAddress(newAddress);

  // Replace the job with updated data
  jobScheduler.enqueueOrReplace(jobId, () -> processApplication(customer));
  </code></pre>
  <br>
  If the job is already processing, it will be interrupted and restarted with 
  the new data!

codeReferences:
  - org/jobrunr/storylinedemo/creditcards/CreditCardService.java?focus=L41-L47

tryIt: |
  <ol>
  <li>Register a credit card</li>
  <li>Immediately update the registration with new details</li>
  <li>Watch the job get replaced in the dashboard!</li>
  </ol>

tryItUrl: /credit-cards/register
dashboardUrl: /dashboard/jobs

learnMore: https://www.jobrunr.io/en/documentation/pro/replace-jobs/

tour:
  narration: |
    Ada applies for a Mastercard, then changes her mind while the job is still in line. It happens. Her
    job id is derived from her email address, so <code>enqueueOrReplace()</code> swaps the pending job for
    one carrying the new card type, interrupting it if it already started. Press both buttons and look for
    exactly one job with her name on it.
  anchor:
    page: /dashboard/jobs?state=ENQUEUED
    selector: "#enqueued-menu-btn"
    fallbackSelector: "#jobs-table-container"
    match: prefix
  placement: right
  actions:
    - label: Ada applies for a Mastercard
      url: /demo/application?cardType=MASTERCARD
    - label: Ada wants an Amex instead
      url: /demo/application?cardType=AMERICAN_EXPRESS
