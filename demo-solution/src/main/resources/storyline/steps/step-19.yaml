title: "Metrics That Matter"
estimatedTime: PT4M

scenario: |
  DevOps needs to set up monitoring and alerting for background jobs:
  How many jobs are we processing per minute? What's the failure rate? 
  Are queues backing up?
  <br><br>
  They need metrics that feed into Prometheus and Grafana (or some competing observability platform).

challenge: |
  How do we expose job metrics for monitoring and alerting systems?

solution: |
  JobRunr Pro integrates with <strong>Micrometer</strong> to expose metrics:
  <br><br>
  <pre class="p-0 m-0">
  <code class="language-properties hljs">
  # In application.properties
  jobrunr.jobs.metrics.enabled=true
  jobrunr.jobs.metrics.micrometer-timers.enabled=true
  </code></pre>
  <br>
  Available metrics include:
  <ul>
    <li><code>jobrunr_jobs_by_state</code> — Jobs per state (ENQUEUED, PROCESSING, etc.)</li>
    <li><code>jobrunr_jobs_in_progress</code> — Jobs in progress</li>
    <li><code>jobrunr_jobs_runs_*</code> — Jobs execution times</li>
    <li><code>jobrunr_background_job_server_*</code> — Server health metrics</li>
  </ul>

codeReferences:
  - org/jobrunr/storylinedemo/StorylineDemoApplication.java

tryIt: |
  Open Prometheus and query JobRunr metrics:
  <br><br>
  <a href="http://localhost:9090/query?g0.expr=jobrunr_jobs_by_state" target="_blank">http://localhost:9090</a>
  <br><br>
  Try: <code>jobrunr_jobs_by_state</code> or <code>rate(jobrunr_jobs_in_progress_seconds_count[5m])</code>

dashboardUrl: http://localhost:9090/query?g0.expr=jobrunr_jobs_by_state

learnMore: https://www.jobrunr.io/en/documentation/pro/observability/

liveNotice: "Prometheus is not wired into this live demo. Run the demo locally and the metrics are all yours."

tour:
  narration: |
    DevOps wants numbers, not vibes. The dashboard home answers the first questions itself: success ratio,
    failed jobs and retries for the period you pick, a processing trend, and a breakdown by state, server or
    job signature. Change the period in the date picker to zoom out. For Prometheus and Grafana, two
    Micrometer properties publish the same kind of numbers, so nobody has to build a metrics side project first.
  mode: dashboard
  anchor:
    page: /dashboard
    selector: "#total-jobs-failed-text"
    fallbackSelector: "#nbr-of-servers-text"
  placement: bottom
  liveNotice: "Prometheus is not wired into this live demo. Run the demo locally to query the Micrometer metrics yourself."

mobile:
  solution: |
    The JobRunr Pro dashboard answers the first questions itself. Its home page shows <strong>Job Analytics</strong>
    for the period you pick: success ratio, succeeded and failed jobs, retries, a processing trend and a
    breakdown by state, server or job signature.
    <br><br>
    For Prometheus and Grafana, JobRunr Pro also publishes metrics through <strong>Micrometer</strong>:
    <br><br>
    <pre class="p-0 m-0">
    <code class="language-properties hljs">
    # In application.properties
    jobrunr.jobs.metrics.enabled=true
    jobrunr.jobs.metrics.micrometer-timers.enabled=true
    </code></pre>
    <br>
    That gives you <code>jobrunr_jobs_by_state</code>, <code>jobrunr_jobs_in_progress</code>, job execution
    times and server health, ready for alerting.
  tryIt: |
    Scroll to Job Analytics: success ratio, failed jobs and retries sit at the top, the processing trend and
    the breakdown by state, server or signature right below.
  dashboardUrl: /dashboard
