title: "Work That Runs Elsewhere"
estimatedTime: PT4M

scenario: |
  Applications the cheap checks cannot decide go to the fraud model, which runs on a GPU cluster
  next to the bank rather than inside this JVM. A run takes minutes. Borderline cases go further still,
  to a compliance officer who answers when they answer.
  <br><br>
  Blocking a worker thread on either of those burns a worker for nothing, and a restart loses the fact
  that the work was ever started.

challenge: |
  How do we keep work that runs somewhere else on the dashboard, with the same retries, timeouts and results?

solution: |
  Create an <strong>external job</strong>. JobRunr runs your method, which hands the case to the other
  system, and then parks the job in <code>PROCESSED</code> instead of finishing it:
  <br><br>
  <pre class="p-0 m-0">
  <code class="language-java hljs">
  UUID jobId = jobScheduler.create(anExternalJob()
      .withName("Fraud review of " + card.getEmail())
      .withProcessTimeOut(Duration.ofMinutes(30))
      .withJobLambda(() -> handOverToRiskCluster(card))).asUUID();

  // ... minutes later, the cluster calls back
  jobScheduler.signalExternalJobSucceeded(jobId, verdict);
  jobScheduler.signalExternalJobFailed(jobId, "model flagged this application");
  jobScheduler.signalExternalJobProgress(jobId, progress);
  </code></pre>
  <br>
  No worker thread is held while the model runs, but the job is still yours: it keeps its labels, its
  result and its place in the dashboard. And because it carries a process timeout, a cluster that never
  reports back fails the job instead of leaving it waiting forever.

codeReferences:
  - org/jobrunr/storylinedemo/creditcards/FraudReviewService.java?focus=L37-L44,L61-L67

tryIt: |
  <ol>
  <li>Send an application to the risk cluster and find it under Processing, waiting in <code>PROCESSED</code></li>
  <li>Report the verdict, the way the cluster's webhook would</li>
  <li>Open the job and read the answer the external system left behind</li>
  </ol>

dashboardUrl: /dashboard/jobs?state=PROCESSED

learnMore: https://www.jobrunr.io/en/documentation/pro/job-timeout/

tour:
  narration: |
    The fraud model runs on a GPU cluster that has never heard of your worker threads. This job hands the
    case over and stops there: JobRunr parks it in PROCESSED, the second number beside Processing, and
    holds no thread while the model thinks. When the cluster reports back, the job succeeds with the
    verdict attached.
  anchor:
    page: /dashboard/jobs?state=PROCESSED
    selector: "#processing-menu-btn"
    fallbackSelector: "#jobs-table-container"
  placement: right
  actions:
    - label: Send an application to the risk cluster
      url: /demo/fraud-review
    - label: Let the cluster report its verdict
      url: /demo/fraud-review/verdict
