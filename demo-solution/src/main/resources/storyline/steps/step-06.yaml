title: "Don't Charge Twice!"
estimatedTime: PT5M

scenario: |
  A payment job failed AFTER the payment was processed but BEFORE it was recorded.
  When the job retried, it charged the customer again.
  <br><br>
  This is a classic idempotency problem — retrying a job must not repeat completed steps.

challenge: |
  How do we make jobs safe to retry without duplicating irreversible operations like payments?

solution: |
  Use <code>JobContext.runStepOnce("step-name", () -> yourLogic)</code> to mark critical sections.
  JobRunr remembers which steps completed, so retries skip already-successful operations.
  <br><br>
  <pre class="p-0 m-0">
  <code class="language-java hljs">
  public void processPayment(JobContext context, Payment payment) {
      context.runStepOnce("charge-card", () -> paymentGateway.charge(payment));
      context.runStepOnce("send-receipt", () -> emailService.sendReceipt(payment));
      context.runStepOnce("update-ledger", () -> ledgerService.record(payment));
  }
  </code></pre>
  <br>
  If the job fails after "charge-card" but before "send-receipt", the retry will skip 
  the charge and continue from the receipt.

codeReferences:
  - org/jobrunr/storylinedemo/payments/PaymentService.java?focus=L87-L100

tryIt: |
  Make a payment using the credit card you've created earlier and watch the job context track completed steps. 
  If you manually retry the job, it won't duplicate the payment!

tryItUrl: /payments/new

dashboardUrl: /dashboard/jobs?jobSignature=org.jobrunr.storylinedemo.payment.PaymentService.processPayment%28java.lang.Long%2C+org.jobrunr.jobs.context.JobContext%29

learnMore: https://www.jobrunr.io/en/documentation/background-methods/best-practices/

tour:
  narration: |
    A payment job that dies halfway must never charge the card twice on the retry, or your customers
    will have "opinions". This is durable execution: <code>context.runStepOnce()</code> records every step
    the job completes, so a retry picks up at the step that failed. Press the button for a payment whose
    transfer times out once, right after the card was charged, and the stage opens that job's Chart.
    Give it a few seconds: on the retry, the steps that already ran turn into hollow diamonds, skipped.
  anchor:
    page: /dashboard/jobs
    selector: "#job-signature-select"
    fallbackSelector: "#job-filter-panel-header"
    reveal: "#job-filter-panel-header"
  placement: bottom
  historyView: chart
  actions:
    - label: Make a payment that times out once
      url: /demo/payment
      focus: "#job-history-chart-panel [role='group']"
      placement: left

mobile:
  tryIt: |
    This is a real payment job. Its History Chart has one row per durable step, with how long each one took.
    When an attempt failed, the retry shows the steps that already ran as hollow diamonds: skipped, so the
    card is charged exactly once.
